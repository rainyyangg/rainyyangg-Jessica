<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOTO ARCHIVE — STILL, JESSICA</title><link rel="stylesheet" href="style.css"><style>.album{max-width:1160px;margin:auto;padding:65px 22px 110px}.album h1{font:clamp(38px,7vw,78px) Georgia,serif;color:#e9d4a7;margin:20px 0}.album p{color:#aaa}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:35px 0}.filters button{background:#161410;color:#e5dfd3;border:1px solid #514631;padding:12px 18px;cursor:pointer}.filters button.active{background:#d7bb83;color:#111}.photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.photo-tile{background:#171512;border:1px solid #302a20;color:#eee;cursor:pointer;padding:0;text-align:left;overflow:hidden}.photo-tile img{display:block;width:100%;height:270px;object-fit:contain;background:#0d0d0d}.tile-info{padding:12px;font-size:12px;overflow-wrap:anywhere}.lightbox{position:fixed;inset:0;background:#000e;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:25px}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:82vh;object-fit:contain}.lightbox button{position:absolute;right:20px;top:15px;color:white;background:none;border:0;font-size:35px;cursor:pointer}.lightbox p{color:#ddd;font-size:12px}@media(max-width:800px){.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo-tile img{height:190px}}</style><style>.photo-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:105;width:clamp(40px,5vw,64px);height:clamp(50px,6vw,76px);border:1px solid #8a734e!important;border-radius:5px;background:#16120bd9!important;color:#f0d7a2!important;font-size:clamp(25px,3vw,40px)!important;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}.photo-nav:hover,.photo-nav:focus-visible{background:#4c3a1b!important;outline:2px solid #d7bb83}.photo-nav.prev{left:clamp(6px,2vw,26px);right:auto;top:50%}.photo-nav.next{right:clamp(6px,2vw,26px);left:auto;top:50%}@media(max-width:650px){.photo-nav{width:38px;height:54px;font-size:26px!important;background:#16120bee!important}}</style><style>.stage-tabs{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:34px}.stage-tabs button{font-size:clamp(16px,2.1vw,24px);padding:17px 24px}.stage-heading{font:normal clamp(27px,3.5vw,40px) Georgia,serif;color:#d7bb83;margin:22px 0 30px}.photographer-tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}.photographer-tabs button{font-size:clamp(13px,1.5vw,18px);padding:12px 18px}.photographer-tabs button.active{background:#d7bb83;color:#111}@media(max-width:650px){.stage-tabs button{padding:12px 16px}.photographer-tabs button{padding:10px 12px}}</style></head><body><div class="topline">INDEPENDENT JESSICA JUNG PHOTO ARCHIVE <span>CURATED BY RAINYYANGG</span></div><header><a class="brand" href="index.html">STILL, <em>JESSICA</em><small>PHOTOGRAPHIC ARCHIVE</small></a><a href="index.html#photo" style="color:#d7bb83">← PHOTO BOARD</a></header><main class="album"><span style="color:#d7bb83;font-size:12px;letter-spacing:.2em">AUTOMATIC PHOTO ARCHIVE</span><h1 id="title">LOADING...</h1><p id="summary"></p><div class="filters" id="filters"></div><div class="photo-grid" id="photos"></div><p>所有照片保留原始檔案與浮水印。分類依上傳資料夾名稱顯示。</p></main><div class="lightbox" id="lightbox" role="dialog" aria-label="照片檢視"><button aria-label="關閉">×</button><button type="button" class="photo-nav prev" aria-label="上一張照片" title="上一張（←）">❮</button><button type="button" class="photo-nav next" aria-label="下一張照片" title="下一張（→）">❯</button><img alt=""><p></p></div><footer><strong>STILL, JESSICA</strong><span>© 2026 RAINYYANGG · FAN ARCHIVE</span><a href="index.html">HOME ↑</a></footer><script src="auto-album.js"></script></body></html>
